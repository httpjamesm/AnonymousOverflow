version: '3'

services:
    anonymousoverflow:
        container_name: 'app'
        image: 'ghcr.io/httpjamesm/anonymousoverflow:latest'
        environment:
            - APP_URL=https://domain.com
            - JWT_SIGNING_SECRET=secret
            - SCRAPER=api
            # - API_KEY=...
            # - TRUSTED_PROXIES=203.0.113.10
        ports:
            - '80:8080'
        restart: 'always'
